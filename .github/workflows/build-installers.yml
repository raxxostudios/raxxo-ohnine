name: Build installers

# Native cross-platform builds. macOS + Linux build fine locally, but Windows
# NSIS needs a real Windows toolchain (cross-building via Wine is not viable on
# an 8GB Apple Silicon Mac). Run this from the Actions tab (or `gh workflow run`)
# to produce installers for every platform, then download them from the run's
# artifacts.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--win nsis"
          - os: ubuntu-latest
            args: "--linux AppImage"
          - os: macos-latest
            args: "--mac dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build installer
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          CSC_IDENTITY_AUTODISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder $BUILD_ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: ignore
